name: Create customer portal instance

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: Company name shown in the wordmark, nav, and report
        required: true
        type: string
      dev_port:
        description: Local port
        required: true
        default: "3001"
        type: string
      api_base_url:
        description: Generic backend origin
        required: true
        default: "http://127.0.0.1:8000"
        type: string
      app_url:
        description: Public portal URL. Leave empty to use http://localhost:<port>
        required: false
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the configured copy
        env:
          PRODUCT_NAME: ${{ inputs.product_name }}
          DEV_PORT: ${{ inputs.dev_port }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          APP_URL: ${{ inputs.app_url }}
        run: |
          args=(
            --dest instance-build
            --no-install
            --name "$PRODUCT_NAME"
            --port "$DEV_PORT"
            --api "$API_BASE_URL"
          )
          if [ -n "$APP_URL" ]; then
            args+=(--app-url "$APP_URL")
          fi
          node scripts/create-instance.mjs "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: customer-portal-instance
          path: instance-build
          if-no-files-found: error
